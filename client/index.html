<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <meta name="description" content="PartyUp - Connect with travel buddies, explore safely together" />
  <meta name="theme-color" content="#1E40AF" />
  <title>PartyUp - Travel Buddy Matching Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap"
    rel="stylesheet" />
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.js"></script>
</head>

<body>
  <div id="root" style="width: 100%; height: 100vh;"></div>
  <script type="module" src="/src/main.tsx"></script>
  <script>
    // Conditionally load analytics only if endpoint is configured.
    // Vite leaves the literal "%VITE_..%" placeholder in place when the env var
    // isn't set at build time, so guard against that in addition to an empty string.
    (function () {
      var endpoint = '%VITE_ANALYTICS_ENDPOINT%';
      var websiteId = '%VITE_ANALYTICS_WEBSITE_ID%';
      var isUnresolved = function (value) {
        return !value || value.indexOf('%') !== -1;
      };
      if (isUnresolved(endpoint) || isUnresolved(websiteId)) {
        return;
      }
      const script = document.createElement('script');
      script.src = endpoint + '/umami';
      script.defer = true;
      script.setAttribute('data-website-id', websiteId);
      document.body.appendChild(script);
    })();
  </script>
</body>

</html>
